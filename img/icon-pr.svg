<svg viewBox="-120 -97 240 164" xmlns="http://www.w3.org/2000/svg">
  <!-- The middle tier's mark is the middle of the ladder: ContinuousReader's
       butterfly is filled, JustReader's is an outline, PlainReader's lower
       wings are painted and its upper ones are not. At 16px in a badge an
       all-outline green mark on a pale green field read as half-filled by
       accident (user, 2026-08-13) — this makes it deliberate, and tells the
       three apps apart at a glance. -->
  <g fill="#2E6B4F" stroke="#2E6B4F" stroke-width="7" stroke-linejoin="round">
    <path d="M -8,4 C -16,44 -62,60 -74,38 C -86,16 -66,-14 -46,-12 C -28,-10 -14,-4 -8,0 Z"/>
    <path d="M 8,4 C 16,44 62,60 74,38 C 86,16 66,-14 46,-12 C 28,-10 14,-4 8,0 Z"/>
  </g>
  <g fill="none" stroke="#2E6B4F" stroke-width="7" stroke-linejoin="round">
    <path d="M -8,-2 C -24,-70 -98,-96 -112,-58 C -125,-20 -98,38 -66,33 C -42,28 -18,12 -8,0 Z"/>
    <path d="M 8,-2 C 24,-70 98,-96 112,-58 C 125,-20 98,38 66,33 C 42,28 18,12 8,0 Z"/>
  </g>
  <circle cx="0" cy="0" r="5" fill="#2E6B4F"/>
</svg>
